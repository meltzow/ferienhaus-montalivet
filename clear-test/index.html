<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLEAR – Dating Prototype Test v2</title>
<style>
:root{--bg:#f4f2ec;--card:#fff;--text:#171717;--muted:#686863;--accent:#204f46;--soft:#e7eee9;--line:#e4e1d9;--warn:#f6efe2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{display:flex;justify-content:center;gap:26px;padding:24px}.phone{width:390px;min-height:820px;background:var(--card);border:1px solid #ddd8ce;border-radius:30px;box-shadow:0 18px 50px #0002;position:relative;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;padding:22px 22px 8px}.brand{font-weight:850;letter-spacing:.08em}.prog{font-size:12px;color:var(--muted)}.screen{padding:20px 22px 105px;min-height:745px}h1{font-size:30px;line-height:1.1;margin:12px 0}h2{font-size:23px;line-height:1.22;margin:10px 0}h3{font-size:16px;margin:10px 0 5px}p{line-height:1.45}.muted{color:var(--muted)}.small{font-size:12px}.eye{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:750}.quote{font-size:20px;font-weight:700;line-height:1.35;margin:20px 0}.card{border:1px solid var(--line);border-radius:17px;padding:15px;margin:12px 0}.soft{background:var(--soft);border:0}.warn{background:var(--warn);border:0}.opt{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:13px;padding:14px;margin:6px 0;font-size:15px;cursor:pointer}.opt.sel{background:var(--soft);border-color:var(--accent)}.bottom{position:absolute;bottom:0;left:0;right:0;background:#fffffff2;border-top:1px solid var(--line);padding:14px 20px 18px}.primary,.secondary{width:100%;border:0;border-radius:13px;padding:14px;font-size:15px;font-weight:750;cursor:pointer}.primary{background:var(--accent);color:#fff}.secondary{background:var(--soft);color:var(--accent)}.profile{border:1px solid var(--line);border-radius:20px;overflow:hidden;cursor:pointer}.photo{height:280px;background:linear-gradient(145deg,#adb8b0,#597169);color:#fff;display:flex;align-items:flex-end;padding:18px}.name{font-size:27px;font-weight:800}.tag{display:inline-block;padding:6px 9px;background:#f0efe9;border-radius:999px;font-size:12px;margin:3px}.bubble{max-width:84%;padding:10px 12px;border-radius:15px;margin:8px 0;background:#efefec;font-size:14px}.me{margin-left:auto;background:var(--soft)}.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.scale button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:12px;cursor:pointer}.scale button.sel{background:var(--soft);border-color:var(--accent)}textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:12px;padding:12px;font:inherit;resize:vertical}.mod{display:none;width:390px;background:#181818;color:#fff;border-radius:18px;padding:18px;position:sticky;top:24px;max-height:calc(100vh - 48px);overflow:auto}.mod.show{display:block}.mod p,.mod li{color:#d1d1d1;line-height:1.45}.mod .box{border:1px solid #444;border-radius:12px;padding:12px;margin:10px 0}.mod textarea{background:#0d0d0d;color:#fff;border-color:#444}.rule{height:1px;background:var(--line);margin:14px 0}.check{display:flex;gap:9px;margin:10px 0}.dot{min-width:20px;height:20px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-size:11px}@media(max-width:900px){.wrap{padding:0}.phone{width:100%;min-height:100vh;border:0;border-radius:0;box-shadow:none}.screen{min-height:calc(100vh - 60px)}.mod{display:none!important}}
</style>
</head>
<body>
<div class="wrap"><main class="phone"><div class="top"><div class="brand">CLEAR</div><div class="prog" id="prog"></div></div><div id="screen" class="screen"></div></main>
<aside class="mod" id="mod"><h2>Moderator · v2</h2><p class="small">Nicht vorlesen, wenn die Testperson nicht festhängt.</p><div class="box"><b>Ziel dieses Screens</b><p id="goal"></p></div><div class="box"><b>Neutrale Frage</b><p id="probe"></p></div><div class="box"><b>Nur bei Unklarheit</b><p id="follow"></p></div><div class="box"><b>Beobachten</b><p id="observe"></p></div><textarea id="notes" placeholder="Wörtliche Aussagen, Zögern, Missverständnisse …"></textarea><button class="secondary" style="margin-top:8px" onclick="saveNotes()">Notizen merken</button></aside></div>
<script>
const V=[
{id:'welcome',html:`<div class="eye">Prototype · v2</div><h1>Dating sollte dir helfen, klarer zu entscheiden.</h1><div class="quote">Lerne die Person kennen, die vor dir ist – nicht die, die du dir ausmalst.</div><div class="card soft"><b>Für diesen Test</b><p>Stell dir vor, du bist Single und möchtest grundsätzlich eine feste Beziehung. Klicke dich so durch, wie du es wirklich tun würdest. Wenn du mit jemandem zusammen testest, sag bitte laut, was dir durch den Kopf geht.</p></div><div class="bottom"><button class="primary" onclick="next()">Starten</button></div>`,goal:'Erster Eindruck ohne Erklärung des Let-Them-Prinzips.',probe:'Was erwartest du nach diesem Startscreen von der App?',follow:'Welche Formulierung ist unklar?',observe:'Kann die Person das Produkt grob einordnen, ohne dass du Klarheit, Coaching oder Let Them erklärst?'},
{id:'intent',html:`<div class="eye">Dein Ziel</div><h2>Was suchst du gerade beim Dating?</h2><button class="opt" data-k="intent">Eine feste Beziehung</button><button class="opt" data-k="intent">Jemanden kennenlernen – mit der Möglichkeit auf eine Beziehung</button><button class="opt" data-k="intent">Offen kennenlernen, ohne festes Ziel</button><button class="opt" data-k="intent">Etwas Lockeres</button><div class="bottom"><button class="primary" onclick="next()">Weiter</button></div>`,goal:'Beziehungsabsicht ohne Fachsprache.',probe:'Bitte wähle das aus, was für dich am ehesten passen würde.',follow:'Fehlt dir eine passende Antwort?',observe:'Zögern wegen unklarer Unterschiede zwischen den Optionen.'},
{id:'boundaries',html:`<div class="eye">Was für dich passen muss</div><h2>Welche Punkte müssen für dich passen, damit du jemanden weiter kennenlernen möchtest?</h2><p class="muted">Wähle bis zu fünf. Du kannst auch nichts auswählen.</p><button class="opt multi" data-k="boundary">Wir suchen ungefähr dasselbe</button><button class="opt multi" data-k="boundary">Die Person ist zuverlässig bei Verabredungen</button><button class="opt multi" data-k="boundary">Unser Kinderwunsch passt zusammen</button><button class="opt multi" data-k="boundary">Die Entfernung ist für mich okay</button><button class="opt multi" data-k="boundary">Unser Umgang mit Rauchen passt</button><button class="opt multi" data-k="boundary">Unsere Vorstellung von Exklusivität passt</button><div class="bottom"><button class="primary" onclick="next()">Weiter</button></div>`,goal:'Eigene Kriterien ohne schwer verständliche negative Grenzensprache.',probe:'Wähle die Punkte aus, die für dich wirklich wichtig wären.',follow:'Was bedeutet die Frage für dich?',observe:'Versteht die Person „passen muss“ oder liest sie die Liste nur als Wunschpartner-Konfigurator?'},
{id:'daily',html:`<div class="eye">Heute</div><h2>Deine 3 Vorschläge für heute</h2><p class="muted">Du bekommst jeden Tag nur wenige Profile, damit du sie in Ruhe ansehen kannst.</p><div class="profile" onclick="next()"><div class="photo"><div><div class="name">Anna, 34</div><div>2 km entfernt</div></div></div><div style="padding:14px"><span class="tag">feste Beziehung</span><span class="tag">Kinder: vielleicht</span><p>„Ich mag Wochenenden draußen, gutes Essen und Menschen, die sagen, was sie meinen.“</p></div></div><p class="muted small">2 weitere Profile heute</p>`,goal:'Reaktion auf bewusst kleine Auswahl.',probe:'Was fällt dir auf diesem Screen auf?',follow:'Wie ist die Anzahl der Profile für dich?',observe:'Nicht fragen, ob drei Profile „besser“ sind – das wäre suggestiv.'},
{id:'profile',html:`<div class="eye">Anna, 34</div><h2>Was spricht dich an Annas Profil an?</h2><div class="card"><h3>Sie sucht</h3><p>Eine feste Beziehung</p><h3>Kommunikation</h3><p>Lieber persönlich als den ganzen Tag schreiben</p><h3>Alltag</h3><p>Köln · Produktdesignerin · gern draußen</p></div><button class="opt multi" data-k="curiosity">Ihre Art / Beschreibung</button><button class="opt multi" data-k="curiosity">Gemeinsame Interessen</button><button class="opt multi" data-k="curiosity">Ihre Beziehungsabsicht</button><button class="opt multi" data-k="curiosity">Körperliche Anziehung</button><button class="opt multi" data-k="curiosity">Noch nichts davon</button><div class="bottom"><button class="primary" onclick="next()">Profil weiter ansehen</button></div>`,goal:'Bewusstes Interesse statt reflexartigem Swipe.',probe:'Was würdest du hier auswählen?',follow:'Welche Information fehlt dir, bevor du jemanden kennenlernen würdest?',observe:'Nicht bewerten, ob die Person Anna attraktiv findet; nur Verständlichkeit und Informationsbedarf.'},
{id:'match',html:`<div class="eye">Match</div><h1>Ihr mögt euch beide.</h1><p>Jetzt könnt ihr herausfinden, ob ihr euch auch im Gespräch und bei einem Treffen mögt.</p><div class="bottom"><button class="primary" onclick="next()">Gespräch ansehen</button></div>`,goal:'Erwartung nach einem Match.',probe:'Was erwartest du jetzt als Nächstes?',follow:'Ist etwas an diesem Screen unklar?',observe:'Erwartet die Person Chat, Date-Vorschlag, Coaching oder weiteres Swipen?'},
{id:'chat',html:`<div class="eye">Nach dem ersten Date</div><h2>Euer letzter Chat</h2><div class="card"><div class="bubble">Der Kaffee gestern war wirklich schön 🙂</div><div class="bubble me">Fand ich auch. Ich würde dich gern wiedersehen.</div><div class="bubble">Sehr gern! Diese Woche ist nur komplett voll bei mir.</div><div class="bubble me">Kein Stress. Sag einfach, wann es bei dir passt.</div></div><div class="card warn"><b>Seit zwei Tagen keine neue Nachricht.</b></div><h3>Was geht dir als Erstes durch den Kopf?</h3><button class="opt" data-k="firstthought">Vielleicht hat sie gerade wenig Zeit.</button><button class="opt" data-k="firstthought">Vielleicht hat sie weniger Interesse.</button><button class="opt" data-k="firstthought">Vielleicht habe ich etwas Falsches gesagt.</button><button class="opt" data-k="firstthought">Ich weiß es nicht.</button><div class="bottom"><button class="primary" onclick="next()">Weiter</button></div>`,goal:'Nur Gedanken messen. v1 mischte Gedanken und Handlungen.',probe:'Lies die Situation und wähle, was deinem ersten Gedanken am nächsten kommt.',follow:'Wenn keine Antwort passt: Was wäre dein eigener erster Gedanke?',observe:'Spontane Interpretation notieren. Noch nicht nach gewünschter Handlung fragen.'},
{id:'clarity',html:`<div class="eye">Clarity Check</div><h2>Was weißt du sicher – und was vermutest du nur?</h2><div class="card soft"><h3>Sicher</h3><p>Anna hat seit zwei Tagen nicht geantwortet.</p></div><div class="card"><h3>Mögliche Erklärungen</h3><p>Sie hat wenig Zeit.<br>Sie hat weniger Interesse.<br>Du hast etwas Falsches gesagt.</p></div><p class="muted">Die Erklärungen können stimmen. Du weißt es im Moment nur nicht.</p><div class="bottom"><button class="primary" onclick="next()">Verstanden</button></div>`,goal:'Kernmechanik: Beobachtung vs. Interpretation.',probe:'Was ist für dich der Unterschied zwischen den beiden Bereichen?',follow:'Welche Aussage hier weißt du wirklich sicher?',observe:'PASS, wenn sinngemäß kommt: Keine Antwort = beobachtbar; der Grund = unklar.'},
{id:'observe',html:`<div class="eye">Erst beobachten</div><h1>Du kennst den Grund nicht.</h1><div class="quote">Und du musst ihn gerade nicht erraten.</div><div class="card"><div class="check"><span class="dot">1</span><span>Schau auf das, was tatsächlich passiert.</span></div><div class="check"><span class="dot">2</span><span>Lass mögliche Erklärungen offen.</span></div><div class="check"><span class="dot">3</span><span>Entscheide dann, was für dich passt.</span></div></div><div class="bottom"><button class="primary" onclick="next()">Was möchte ich jetzt tun?</button></div>`,goal:'Kernprinzip ohne Let-Them-Jargon.',probe:'Was nimmst du aus diesem Screen mit?',follow:'Was würdest du danach konkret tun?',observe:'HARD FAIL, wenn die Person nur „nichts tun / alles hinnehmen“ versteht.'},
{id:'decide',html:`<div class="eye">Deine Entscheidung</div><h2>Was passt jetzt am besten zu dir?</h2><button class="opt" data-k="decision">Ich warte erst einmal ab.</button><button class="opt" data-k="decision">Ich frage einmal direkt nach.</button><button class="opt" data-k="decision">Ich möchte den Kontakt für mich loslassen.</button><button class="opt" data-k="decision">Ich weiß es noch nicht.</button><div class="card soft"><b>Wenn du direkt nachfragen willst:</b><p>„Hey Anna, ich fand unser Treffen schön. Hast du noch Lust, dich weiter kennenzulernen?“</p></div><div class="bottom"><button class="primary" onclick="next()">Weiter</button></div>`,goal:'Eigene Handlung statt vorgegebener Lösung.',probe:'Welche Option wäre für dich am ehesten passend?',follow:'Fehlt dir eine Handlung, die du stattdessen wählen würdest?',observe:'Kein Urteil über die gewählte Option. Prüfe nur, ob sich die Person frei entscheiden kann.'},
{id:'date',html:`<div class="eye">Neues Beispiel</div><h2>Ihr habt euch für ein zweites Date verabredet.</h2><p class="muted">Für den Test springen wir zur Situation direkt nach diesem Treffen.</p><div class="card"><b>Samstag · 16:00</b><p>Ihr wart ungefähr zwei Stunden zusammen.</p></div><div class="bottom"><button class="primary" onclick="next()">Nach dem Date</button></div>`,goal:'Szenariowechsel ohne Widerspruch zur vorherigen Nutzerentscheidung.',probe:'Ist klar, warum wir hier zu einem neuen Beispiel springen?',follow:'Was erwartest du als Nächstes?',observe:'Dieser Screen testet kein Date-Planungsfeature.'},
{id:'reflection',html:`<div class="eye">Nach dem Date</div><h2>Wie hast du dich während des Treffens überwiegend gefühlt?</h2><button class="opt" data-k="feeling">Entspannt und wohl</button><button class="opt" data-k="feeling">Interessiert und neugierig</button><button class="opt" data-k="feeling">Unsicher oder angespannt</button><button class="opt" data-k="feeling">Unwohl</button><h3>Was ist konkret passiert?</h3><p class="muted small">Wähle nur Dinge, die du beobachten konntest.</p><button class="opt multi" data-k="datefact">Anna war wie vereinbart da.</button><button class="opt multi" data-k="datefact">Anna hat dir mehrere Fragen gestellt.</button><button class="opt multi" data-k="datefact">Anna hat selbst ein weiteres Treffen vorgeschlagen.</button><button class="opt multi" data-k="datefact">Anna hat sich an eure Absprachen gehalten.</button><div class="bottom"><button class="primary" onclick="next()">Speichern</button></div>`,goal:'Gefühl und beobachtbares Verhalten getrennt erfassen.',probe:'Was würdest du hier tatsächlich auswählen?',follow:'Gibt es etwas, das du nach einem Date eher festhalten würdest?',observe:'v1 behandelte „hat Interesse gezeigt“ fälschlich als Fakt. Jetzt nur beobachtbare Ereignisse.'},
{id:'reality',html:`<div class="eye">Reality Log</div><h2>Was Anna sagt – und was bisher passiert ist</h2><div class="card"><h3>Anna sagt</h3><p>„Ich suche eine feste Beziehung.“</p><div class="rule"></div><h3>Bisher beobachtet</h3><p>✓ zwei Dates<br>✓ hat das zweite Treffen mitgeplant<br>✓ war bei beiden Treffen wie vereinbart da<br>• schreibt zwischen den Dates eher wenig</p></div><h3>Wenn du nur auf diese Informationen schaust:</h3><p>Wie gut passt Annas Verhalten zu dem, was du suchst?</p><button class="opt" data-k="fit">Passt gut</button><button class="opt" data-k="fit">Kann ich noch nicht beurteilen</button><button class="opt" data-k="fit">Passt eher nicht</button><div class="bottom"><button class="primary" onclick="next()">Weiter</button></div>`,goal:'Nutzen und mögliche Aversion gegen das Reality Log.',probe:'Was glaubst du, wozu dieser Screen da ist?',follow:'Was daran wäre für dich hilfreich oder unangenehm?',observe:'Nicht „creepy?“ sagen – das würde eine negative Antwort primen.'},
{id:'coach',html:`<div class="eye">CLEAR Coach</div><h2>„Sie sagt, sie hat viel Stress und schreibt deshalb wenig. Wie soll ich das einordnen?“</h2><div class="card"><h3>Was du weißt</h3><p>Ihr hattet zwei Dates. Anna hat das zweite Treffen mitgeplant. Zwischen den Dates schreibt sie eher wenig.</p></div><div class="card"><h3>Was offen bleibt</h3><p>Wie stark ihr Interesse ist und ob Stress der einzige Grund für wenig Kontakt ist.</p></div><div class="card soft"><h3>Was du für dich klären kannst</h3><p>Wie viel Kontakt brauchst du, damit sich Kennenlernen für dich gut anfühlt?</p></div><div class="bottom"><button class="primary" onclick="next()">Zum Abschluss</button></div>`,goal:'Mehrwert des strukturierten Coaches testen, ohne ChatGPT zu nennen.',probe:'Was würdest du nach dieser Antwort als Nächstes tun?',follow:'Erinnert dich diese Art von Hilfe an etwas, das du heute schon nutzt?',observe:'Wenn ChatGPT spontan genannt wird, notieren. Nicht selbst zuerst ChatGPT nennen.'},
{id:'survey',html:`<div class="eye">Abschluss</div><h2>Zum Schluss vier kurze Fragen</h2><h3>1. Wenn du an die gezeigte Situation denkst: Wie hilfreich war CLEAR?</h3><p class="muted small">1 = überhaupt nicht hilfreich · 5 = sehr hilfreich</p><div class="scale" data-scale="helpful"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><h3>2. Wie leicht war zu verstehen, was du auf den Screens tun solltest?</h3><p class="muted small">1 = sehr schwer · 5 = sehr leicht</p><div class="scale" data-scale="ease"><button>1</button><button>2</button><button>3</button><button>4</button><button>5</button></div><h3>3. Wenn du in den nächsten Wochen in einer ähnlich unklaren Dating-Situation wärst: Würdest du CLEAR öffnen?</h3><button class="opt" data-k="useintent">Ja</button><button class="opt" data-k="useintent">Vielleicht</button><button class="opt" data-k="useintent">Nein</button><h3>4. Was war unklar, unnötig oder hat dir gefehlt?</h3><textarea id="freefeedback" placeholder="Bitte so konkret wie möglich …"></textarea><div class="bottom"><button class="primary" onclick="next()">Weiter</button></div>`,goal:'Nutzen, Bedienbarkeit und konkrete Nutzungsabsicht – ohne abstraktes „Kernprinzip“.',probe:'Bitte beantworte die Fragen ohne weitere Erklärung.',follow:'Nur wenn etwas unverständlich ist: Was genau ist an der Frage unklar?',observe:'Keine Zahlungsfrage in Runde 1. Erst belegen, dass ein echter Use Case besteht.'},
{id:'teachback',html:`<div class="eye">Eine letzte Sache</div><h2>Wie würdest du CLEAR einer Freundin oder einem Freund in einem Satz erklären?</h2><textarea id="teachback" placeholder="CLEAR hilft mir dabei, …"></textarea><p class="muted small">Es gibt keine richtige Antwort. Uns interessiert, was bei dir angekommen ist.</p><div class="bottom"><button class="primary" onclick="finish()">Test abschließen</button></div>`,goal:'Unaided Teach-back statt Selbsteinschätzung „Kernprinzip verstanden?“.',probe:'Bitte erkläre CLEAR in deinen eigenen Worten.',follow:'Keine Hilfestellung geben.',observe:'PASS, wenn Beobachtung/Realität und eigene Entscheidung sinngemäß vorkommen. FAIL, wenn nur „Dating-App“ oder „AI sagt mir, was ich tun soll“.'},
{id:'done',html:`<div class="eye">Fertig</div><h1>Danke.</h1><p>Das war der komplette Test.</p><div class="card soft"><b>Wir testen den Entwurf – nicht dich.</b><p class="small">Deine Antworten bleiben aktuell nur in diesem Browser. Die automatische Übertragung bauen wir erst im nächsten Schritt.</p></div><button class="secondary" onclick="downloadData()">Testdaten herunterladen</button>`,goal:'Abschluss.',probe:'Denke an deine letzte unklare Dating-Situation. An welcher Stelle hätte CLEAR geholfen – oder nicht?',follow:'Danach: Was würdest du aus CLEAR streichen? Was würdest du heute stattdessen benutzen?',observe:'Offene Antworten möglichst wörtlich notieren.'}
];
let i=0,enter=Date.now();const D={version:'2.0',startedAt:new Date().toISOString(),choices:{},scales:{},text:{},events:[],times:{},notes:''};const screen=document.getElementById('screen');
function log(type,o={}){D.events.push({time:new Date().toISOString(),screen:V[i].id,type,...o})}
function storeText(){const f=document.getElementById('freefeedback');if(f)D.text.freefeedback=f.value;const t=document.getElementById('teachback');if(t)D.text.teachback=t.value}
function bind(){document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(b.classList.contains('multi')){if(b.textContent.includes('Noch nichts davon'))document.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.classList.remove('sel'));else document.querySelectorAll(`[data-k="${k}"]`).forEach(x=>{if(x.textContent.includes('Noch nichts davon'))x.classList.remove('sel')});b.classList.toggle('sel');D.choices[k]=[...document.querySelectorAll(`[data-k="${k}"].sel`)].map(x=>x.textContent.trim())}else{document.querySelectorAll(`[data-k="${k}"]`).forEach(x=>x.classList.remove('sel'));b.classList.add('sel');D.choices[k]=b.textContent.trim()}log('choice',{key:k,value:D.choices[k]})});document.querySelectorAll('[data-scale]').forEach(g=>g.querySelectorAll('button').forEach(b=>b.onclick=()=>{g.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));b.classList.add('sel');D.scales[g.dataset.scale]=Number(b.textContent);log('scale',{key:g.dataset.scale,value:Number(b.textContent)})}))}
function show(n){storeText();if(V[i])D.times[V[i].id]=(D.times[V[i].id]||0)+(Date.now()-enter);i=Math.max(0,Math.min(n,V.length-1));enter=Date.now();screen.innerHTML=V[i].html;document.getElementById('prog').textContent=`${i+1} / ${V.length}`;document.getElementById('goal').textContent=V[i].goal;document.getElementById('probe').textContent=V[i].probe;document.getElementById('follow').textContent=V[i].follow;document.getElementById('observe').textContent=V[i].observe;bind();log('view');scrollTo(0,0)}
function next(){show(i+1)}function finish(){storeText();show(i+1)}function saveNotes(){D.notes=document.getElementById('notes').value}function downloadData(){storeText();saveNotes();D.completedAt=new Date().toISOString();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download=`clear-test-v2-${new Date().toISOString().slice(0,10)}.json`;a.click()}
if(new URLSearchParams(location.search).get('moderator')==='1')document.getElementById('mod').classList.add('show');show(0);
</script>
</body>
</html>
